<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grãos e Sabores</title>
    <link rel="icon" href="imagens/biel graos e sabores.png">
    <style>
        html {
            scroll-behavior: smooth;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #f4f9f4;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        nav {
            position: sticky;
            top: 0;
            background: linear-gradient(90deg, #2d2e18);
            padding: 12px;
            text-align: center;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
            font-size: clamp(10px, 2.5vw, 14px);
            white-space: nowrap;
        }

        nav a:hover {
            text-decoration: underline;
        }

        header {
            background-color: #3F4021;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .catalogo {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            padding: 30px;
        }


        .produto {
            background: #fff;
            border: 2px solid #696b3a;
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            position: relative;
            overflow: visible;
            transition: .25s;
        }

        .produto:hover {
            transform: translateY(-6px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .produto img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 12px;
            transition: transform .3s;
            position: relative;
            z-index: 1;
        }

        .produto:hover img {
            transform: scale(1.06);
        }

        .produto h2 {
            color: #696b3a;
            margin-bottom: 6px;
            font-size: 18px;
            min-height: 44px;
        }

        .preco {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .descricao {
            font-size: 13px;
            color: #666;
            margin-bottom: 6px;
        }

        .gramas {
            font-size: 13px;
            color: #777;
            margin-bottom: 4px;
        }

        .estrelas {
            color: #f1c40f;
            margin-bottom: 6px;
            font-size: 14px;
        }


        footer {
            background-color: #3F4021;
            color: white;
            text-align: center;
            padding: 12px;
            margin-top: 30px;
        }

        .botao-wpp {
            position: fixed;
            bottom: 40px;
            right: 20px;
            animation: pulse 1.8s infinite;
            z-index: 9999;
        }

        .icon-insta {
            position: fixed;
            bottom: 140px;
            right: 20px;
            animation: pulse 1.8s infinite;
            z-index: 9999;
        }

        .btn-comprar {
            display: block;
            margin-top: 12px;

            width: 100%;
            padding: 10px;

            background-color: #3F4021;
            color: white;
            text-decoration: none;
            text-align: center;

            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
        }

        .btn-comprar:hover {
            background-color: #262712;
            transform: scale(1.03);
        }

        .btn-comprar:active {
            transform: scale(0.98);
        }

        h1 {
            text-align: center;
            color: #3F4021;
            font-family: Tahoma, Verdana, sans-serif;
            font-size: 34px;
            margin: 50px 0 25px;
        }

        h1::after {
            content: "";
            display: block;
            width: 70px;
            height: 4px;
            background: #3F4021;
            margin: 10px auto 0;
            border-radius: 10px;
        }

        .topo {
            position: fixed;
            bottom: 25px;
            left: 20px;
            background: #2d2e18;
            color: #fff;
            padding: 10px 14px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 14px;
            z-index: 9999;
        }

        .topo:hover {
            transform: translateY(-4px);
            background: #1e1f10;
        }

        .menu-produto {
            position: absolute;
            top: 8px;
            right: 10px;
            z-index: 20;
        }

        .menu-produto summary {
            list-style: none;
            cursor: pointer;
            font-size: 22px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 6px;
            transition: .2s;
        }

        .menu-produto summary:hover {
            background: #a9a9a9;
        }

        .menu-produto summary::-webkit-details-marker {
            display: none;
        }

        .info-produto {
            position: absolute;
            top: 32px;
            left: -150px;
            width: 200px;
            background: #212121;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 10px;
            text-align: left;
            font-size: 13px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .15);
            z-index: 999;
            color: #ffffff;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.12);
            }

            100% {
                transform: scale(1);
            }
        }

        .barra-pesquisa {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            position: sticky;
            top: 45px;
            z-index: 999;
        }

        #pesquisa {
            width: 100%;
            max-width: 400px;
            padding: 12px 16px;
            border-radius: 25px;
            border: 2px solid #3F4021;
            outline: none;
            font-size: 16px;
            background: #fff;
            transition: 0.3s;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        #pesquisa::placeholder {
            color: #999;
        }

        #pesquisa:focus {
            border-color: #1e1f10;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        #resultado {
            font-weight: bold;
            text-align: center;
            margin: 10px 0;
        }

        .carrinho {
            position: fixed;
            bottom: 120px;
            right: 20px;
            z-index: 1000;
        }

        #finalizar {
            background: #3F4021;
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        #finalizar:hover {
            background: #262712;
        }

        .icone-carrinho {
            position: fixed;
            top: 45px;
            right: 15px;
            background: #252515;
            color: white;
            padding: 10px 14px;
            border-radius: 20px;
            cursor: pointer;
            z-index: 2000;
        }

        .carrinho-box {
            position: fixed;
            right: -350px;
            top: 0;
            width: 300px;
            height: 100%;
            background: white;
            box-shadow: -5px 0 15px rgba(0, 0, 0, 0.2);
            padding: 20px;
            transition: 0.3s;
            z-index: 10000;
            overflow-y: auto;
        }

        .carrinho-box.ativo {
            right: 0;
        }

        .carrinho-box button {
            background: #3F4021;
            color: white;
            border: none;
            padding: 4px 6px;
            margin: 4px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            min-width: 20px;
        }

        .carrinho-box button:hover {
            background: #262712;
        }

        #listaCarrinho div {
            margin-bottom: 10px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
        }

        @media (max-width:600px) {
            h1 {
                font-size: 26px
            }

            .catalogo {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }

            header {
                padding: 10px 10px;
            }

            .produto {
                padding: 8px;
            }

            .produto img {
                height: 100px;
            }

            .produto h2 {
                font-size: 12px;
                margin: 4px 0;
            }

            .preco {
                font-size: 14px;
            }

            .btn-comprar {
                font-size: 11px;
                padding: 5px;
            }

            .icone-carrinho {
                top: 97px;
                right: 15px;
            }

            .carrinho-box {
                width: 230px;
            }

            /* Seletor de gramas menor em mobile */
            .seletor-gramas {
                gap: 4px;
            }

            .btn-grama {
                font-size: 11px !important;
                padding: 4px 8px !important;
            }
        }

        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #3F4021;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
            z-index: 3000;
        }

        #toast.mostrar {
            opacity: 1;
            bottom: 50px;
        }

        .controle-produto {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .controle-produto button {
            background: #3F4021;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .controle-produto span {
            font-weight: bold;
            font-size: 16px;
        }

        /* =======================
   SELETOR DE GRAMAGEM
   ======================= */

        .seletor-gramas {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 8px 0 4px;
        }

        .btn-grama {
            background: #fff;
            color: #3F4021;
            border: 2px solid #696b3a;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, transform 0.15s;
        }

        .btn-grama:hover {
            background: #696b3a;
            color: #fff;
            transform: scale(1.05);
        }

        .btn-grama.ativo {
            background: #3F4021;
            color: #fff;
            border-color: #3F4021;
        }

        /* =======================
   PRODUTO INDISPONÍVEL
   ======================= */

        .produto.indisponivel {
            filter: grayscale(1);
            opacity: .65;
            position: relative;
        }

        .produto.indisponivel:hover {
            transform: none;
            box-shadow: none;
        }

        .produto.indisponivel::after {
            content: "INDISPONÍVEL";
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-8deg);
            background: rgba(176, 48, 48, .93);
            color: #fff;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
            padding: 8px 16px;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .3);
            z-index: 25;
            white-space: nowrap;
        }

        .produto.indisponivel .controle-produto,
        .produto.indisponivel .seletor-gramas,
        .produto.indisponivel .menu-produto {
            pointer-events: none;
            opacity: .5;
        }

        #loading-produtos {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            gap: 16px;
            color: #6b7a3a;
            font-family: "DM Sans", sans-serif;
            font-size: 15px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e8ede8;
            border-top-color: #3F4021;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body id="topo">
    <header>
        <img src="imagens/biel graos e sabores.png" alt="biel graos e sabores" style="height: 125px;">
    </header>

    <nav>
        <a href="#temperos">Temperos</a>
        <a href="#snacks">Snacks</a>
        <a href="#farinhas energeticas">Farinhas Energéticas</a>
        <a href="#graos e sementes">Grãos e Sementes</a>
    </nav>

    <div class="barra-pesquisa">
        <input type="text" id="pesquisa" placeholder="🔎 Buscar produto...">
    </div>
    <p id="resultado"></p>

    <div id="loading-produtos">
        <div class="loading-spinner"></div>
        <p>Carregando produtos...</p>
    </div>

    <footer>
        <p>© 2026 - Loja de Grãos e Condimentos</p>
    </footer>

    <a class="botao-wpp" href="https://wa.me/5527998177162" target="_blank">
        <img src="imagens/whatsapp.png" width="80px">
    </a>

    <a class="icon-insta" href="https://www.instagram.com/graosesabores.biel/" target="_blank">
        <img src="imagens/instagram.png" width="80px">
    </a>

    <div class="icone-carrinho" id="abrirCarrinho">
        🛒 <span id="contador">0</span>
    </div>

    <div class="carrinho-box" id="carrinhoBox">
        <h3>Seu Carrinho</h3>
        <div id="listaCarrinho"></div>

        <p id="totalCarrinho">Total: R$ 0</p>
        <br>
        <button id="finalizar">Finalizar no WhatsApp</button>
    </div>

    <div id="toast">Produto adicionado ao carrinho</div>

    <a href="#topo" class="topo">↑ Topo</a>

    <script src="config.js"></script>
<script src="config.local.js"></script>
<script src="script.js"></script>
</body>

</html>
